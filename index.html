  // メニュー編集の操作
  $('#menuEditBody').addEventListener('click', (e) => {
    const m = state.editingMenu; if (!m) return;
    const setB = e.target.closest('[data-mset]');
    if (setB) { const [i,d] = setB.dataset.mset.split(':').map(Number); m.items[i].sets = Math.max(1, Math.min(20, m.items[i].sets + d)); $('#msetv'+i).textContent = m.items[i].sets; return; }
    const repB = e.target.closest('[data-mreps]');
    if (repB) { const [i,d] = repB.dataset.mreps.split(':').map(Number); m.items[i].reps = Math.max(1, Math.min(50, m.items[i].reps + d)); $('#mrepsv'+i).textContent = m.items[i].reps; return; }
    const wtB = e.target.closest('[data-mwt]');
    if (wtB) {
      const [i,d] = wtB.dataset.mwt.split(':').map(Number);
      const cur = m.items[i].weight || 0;
      const v = Math.max(0, Math.round((cur + d*state.weightStep)*100)/100);
      m.items[i].weight = v;
      $('#mwv'+i).value = v ? fmtNum(v) : '';
      return;
    }
    const rm = e.target.closest('[data-mremove]');
    if (rm) {
      const i = parseInt(rm.dataset.mremove,10);
      const ex = exById(m.items[i].exerciseId);
      if (!confirm(`「${ex ? ex.name : '種目'}」をメニューから外しますか？`)) return;
      m.items.splice(i,1); renderMenuEdit(); return;
    }
    const addEx = e.target.closest('#menuAddEx');
    if (addEx) { openExercisePicker('menu'); return; }
    const dupB = e.target.closest('#menuDup');
    if (dupB) { duplicateMenu(); return; }
    const delB = e.target.closest('#menuDelete');
    if (delB) { confirmDeleteMenu(); return; }
  });

  // 編集中のメニューを複製して、そのまま複製版の編集に切り替える
  async function duplicateMenu() {
    const m = state.editingMenu; if (!m) return;
    const base = (m.name || '無題').trim();
    // 「〜のコピー」「〜のコピー2」…と重複しない名前にする
    let name = `${base}のコピー`, n = 2;
    while (state.menus.some(x => x.name === name)) { name = `${base}のコピー${n}`; n++; }
    const obj = {
      id: uid(), name, note: (m.note||'').trim(),
      items: m.items.map(it => ({ exerciseId: it.exerciseId, sets: it.sets, reps: it.reps, weight: it.weight || 0 })),
      order: (Math.max(0, ...state.menus.map(x=>x.order||0))+1),
      createdAt: now(), updatedAt: now(),
    };
    await put('menus', obj);
    state.menus.push(obj);
    openMenuEdit(obj.id);   // 複製版をそのまま編集
    toast(`「${name}」を作成しました`);
  }
  // 入力欄の変更を作業コピーに反映
  $('#menuEditBody').addEventListener('input', (e) => {
    const m = state.editingMenu; if (!m) return;
    if (e.target.id === 'menuName') m.name = e.target.value;
    if (e.target.id === 'menuNote') m.note = e.target.value;
    if (e.target.id && e.target.id.startsWith('mwv')) {
      const i = parseInt(e.target.id.slice(3), 10);
      const v = parseFloat(e.target.value);
      if (m.items[i]) m.items[i].weight = (v > 0) ? Math.round(v*100)/100 : 0;
    }
  });

  $('#menuEditBack').addEventListener('click', () => closeMenuEdit(false));
  $('#menuEditSave').addEventListener('click', async () => {
    const m = state.editingMenu; if (!m) return;
    const name = (m.name||'').trim();
    if (!name) { toast('メニュー名を入力してください'); return; }
    const obj = { id: m.id, name, note: (m.note||'').trim(), items: m.items.map(it => ({ exerciseId: it.exerciseId, sets: it.sets, reps: it.reps, weight: it.weight || 0 })), order: m.order, createdAt: m.createdAt, updatedAt: now() };
    await put('menus', obj);
    const idx = state.menus.findIndex(x => x.id === obj.id);
    if (idx >= 0) state.menus[idx] = obj; else state.menus.push(obj);
    closeMenuEdit(true);
    toast('保存しました');
  });

  async function confirmDeleteMenu() {
    const m = state.editingMenu; if (!m) return;
    if (!confirm(`メニュー「${m.name||'(無題)'}」を削除しますか？`)) return;
    await del('menus', m.id);
    state.menus = state.menus.filter(x => x.id !== m.id);
    closeMenuEdit(true);
    toast('削除しました');
  }


  function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function fmtNum(n){ return String(Math.round(n*100)/100); }
  // ミリ秒 → "19:32"
  function fmtTime(ms){
    const d = new Date(ms);
    return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
  }
  // その種目の実施時刻（最初のセット〜最後のセット）
  function timeRange(sets){
    const ts = sets.map(s => s.at).filter(Boolean);
    if (!ts.length) return null;
    const first = Math.min(...ts), last = Math.max(...ts);
    if (ts.length === 1 || first === last) return fmtTime(first);
    return `${fmtTime(first)} → ${fmtTime(last)}`;
  }

  // ---------- タブ切替 ----------

  // ---------- タブ定義（順序は設定で変更可） ----------
  const TAB_DEFS = {
    rec:  { label: '記録',     icon: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>' },
    hist: { label: '履歴',     icon: '<path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/>' },
    menu: { label: 'メニュー', icon: '<path d="m12 2 8 4.5v9L12 20l-8-4.5v-9L12 2Z"/><path d="m4 7 8 4.5L20 7"/><path d="M12 20v-8.5"/>' },
    ex:   { label: '種目',     icon: '<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>' },
  };
  const DEFAULT_TAB_ORDER = ['rec','hist','menu','ex'];

  function renderTabbar() {
    const order = state.tabOrder;
    $('#tabbar').innerHTML = order.map(id => {
      const d = TAB_DEFS[id]; if (!d) return '';
      return `<button class="tab ${state.tab===id?'active':''}" data-tab="${id}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d.icon}</svg>
        <span>${d.label}</span>
      </button>`;
    }).join('');
  }
  // タブは動的生成なので、委任で受ける
  $('#tabbar').addEventListener('click', (e) => {
    const b = e.target.closest('[data-tab]'); if (!b) return;
    switchTab(b.dataset.tab);
  });

  function switchTab(tab) {
    state.tab = tab;
    renderTabbar();
    $('#recView').classList.toggle('active', tab==='rec');
    $('#histView').classList.toggle('active', tab==='hist');
    $('#menuView').classList.toggle('active', tab==='menu');
    $('#exView').classList.toggle('active', tab==='ex');
    if (state.editingMenu) { document.body.classList.remove('editing'); state.editingMenu = null; state.editingSnapshot = null; }
    $('#menuEditView').classList.remove('active');
    if (tab==='menu') renderMenu();
    if (tab==='hist') renderHist();
    syncWakeLock();
  }

  // ---------- 日付ナビ ----------
  $('#datePrev').addEventListener('click', () => { state.recDate = shiftDay(state.recDate, -1); renderRec(); });
  $('#dateNext').addEventListener('click', () => { if (state.recDate < todayStr()) { state.recDate = shiftDay(state.recDate, 1); renderRec(); } });
  $('#dateChip').addEventListener('click', () => {
    const dp = $('#datePicker');
    dp.value = state.recDate;
    dp.max = todayStr();
    if (dp.showPicker) { try { dp.showPicker(); return; } catch (_) {} }
    dp.click();
  });
  $('#datePicker').addEventListener('change', (e) => {
    const v = e.target.value;
    if (!v) return;
    state.recDate = (v > todayStr()) ? todayStr() : v;
    renderRec();
  });
  $('#toTodayBtn').addEventListener('click', () => { state.recDate = todayStr(); renderRec(); });

  // ---------- 記録ボディの操作（イベント委任） ----------
  // ---------- セット行のスワイプ削除 ----------
  const SWIPE_W = 92;           // 削除ボタンの幅
  let swipe = null;             // 進行中のスワイプ情報

  function closeSwipes(except) {
    $$('.set-row.swiped').forEach(r => {
      if (r === except) return;
      r.classList.remove('swiped');
      r.style.transform = '';
    });
  }

  const recBodyEl = $('#recBody');
  recBodyEl.addEventListener('touchstart', (e) => {
    const row = e.target.closest('.set-row');
    if (!row) { closeSwipes(null); swipe = null; return; }
    const opened = row.classList.contains('swiped');
    closeSwipes(row);
    swipe = {
      el: row,
      x: e.touches[0].clientX, y: e.touches[0].clientY,
      base: opened ? -SWIPE_W : 0,
      dx: opened ? -SWIPE_W : 0,
      decided: false, horiz: false,
    };
  }, { passive: true });

  recBodyEl.addEventListener('touchmove', (e) => {
    if (!swipe) return;
    const dx = e.touches[0].clientX - swipe.x;
    const dy = e.touches[0].clientY - swipe.y;
    if (!swipe.decided) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;   // 微動は無視
      swipe.decided = true;
      swipe.horiz = Math.abs(dx) > Math.abs(dy) * 1.2;    // 横が優勢な時だけスワイプ扱い
      if (!swipe.horiz) { swipe = null; return; }         // 縦スクロールは邪魔しない
      swipe.el.style.transition = 'none';
    }
    if (!swipe.horiz) return;
    let t = swipe.base + dx;
    t = Math.max(-SWIPE_W - 24, Math.min(0, t));          // 右には動かさない
    swipe.dx = t;
    swipe.el.style.transform = `translateX(${t}px)`;
    if (e.cancelable) e.preventDefault();                 // 横に振った時だけ既定動作を止める
  }, { passive: false });

  function endSwipe() {
    if (!swipe) return;
    const { el, horiz, dx } = swipe;
    if (horiz) {
      el.style.transition = '';
      const open = dx < -SWIPE_W / 2;
      el.classList.toggle('swiped', open);
      el.style.transform = open ? `translateX(${-SWIPE_W}px)` : '';
      // スワイプ直後のタップで編集シートが開かないように
      el.dataset.justSwiped = '1';
      setTimeout(() => { delete el.dataset.justSwiped; }, 350);
    }
    swipe = null;
  }
  recBodyEl.addEventListener('touchend', endSwipe, { passive: true });
  recBodyEl.addEventListener('touchcancel', endSwipe, { passive: true });

  // スワイプで出した削除ボタン
  async function swipeDeleteSet(ei, si) {
    const w = workoutByDate(state.recDate); if (!w || !w.entries[ei]) return;
    const entry = w.entries[ei];
    const s = entry.sets[si]; if (!s) return;
    // 最後の1セットだけは種目ごと消えるので確認する
    if (entry.sets.length === 1) {
      const ex = exById(entry.exerciseId);
      if (!confirm(`最後のセットです。削除すると「${ex ? ex.name : '種目'}」も記録から外れます。よろしいですか？`)) { closeSwipes(null); return; }
    }
    entry.sets.splice(si, 1);
    if (!entry.sets.length) w.entries.splice(ei, 1);
    await saveWorkout(w);
    renderRec();
  }

  // 種目追加は固定フッター（#recBodyの外）にあるので個別に登録する
  $('#addExToDay').addEventListener('click', () => openExercisePicker());

  $('#recBody').addEventListener('click', (e) => {
    const mv = e.target.closest('[data-moveex]');
    if (mv) { const [i,d] = mv.dataset.moveex.split(':').map(Number); moveEntry(i, d); return; }
    const rep = e.target.closest('[data-repeatset]');
    if (rep) { repeatLastSet(parseInt(rep.dataset.repeatset,10)); return; }
    const addSet = e.target.closest('[data-addset]');
    if (addSet) { openSetSheet(parseInt(addSet.dataset.addset,10), null); return; }
    const swDel = e.target.closest('[data-swipedel]');
    if (swDel) { const [ei,si] = swDel.dataset.swipedel.split(':').map(Number); swipeDeleteSet(ei, si); return; }
    const editSet = e.target.closest('[data-editset]');
    if (editSet) {
      if (editSet.dataset.justSwiped) return;                 // スワイプ直後は開かない
      if (editSet.classList.contains('swiped')) { closeSwipes(null); return; } // 開いていたら閉じるだけ
      const [ei,si] = editSet.dataset.editset.split(':').map(Number); openSetSheet(ei, si); return;
    }
    const delEx = e.target.closest('[data-delex]');
    if (delEx) { confirmDelEntry(parseInt(delEx.dataset.delex,10)); return; }
    const tg = e.target.closest('[data-toggle]');
    if (tg) { const id = tg.dataset.toggle; state.collapsed[id] = !state.collapsed[id]; renderRec(); return; }
    closeSwipes(null);
  });

  // 種目カードの並べ替え
  async function moveEntry(i, d) {
    const w = workoutByDate(state.recDate); if (!w) return;
    const j = i + d;
    if (j < 0 || j >= w.entries.length) return;
    [w.entries[i], w.entries[j]] = [w.entries[j], w.entries[i]];
    await saveWorkout(w);
    renderRec();
  }

  // 直前セットと同じ内容でもう1セット記録
  async function repeatLastSet(ei) {
    const w = workoutByDate(state.recDate); if (!w || !w.entries[ei]) return;
    const entry = w.entries[ei];
    const last = entry.sets[entry.sets.length-1]; if (!last) return;
    // 保存を待つ前にタイマーを開始（タップの流れを切らさないため）
    const exName = (exById(entry.exerciseId)||{}).name || '';
    if (state.recDate === todayStr()) startRest(exName);
    entry.sets.push({ w: last.w, r: last.r, at: now() });
    await saveWorkout(w);
    renderRec();
    const setNo = entry.sets.length;
    toast(`${setNo}セット目を記録（${last.r}回 × ${fmtNum(last.w)}kg）`);
  }

  async function confirmDelEntry(ei) {
    const w = workoutByDate(state.recDate); if (!w) return;
    const ex = exById(w.entries[ei].exerciseId);
    if (!confirm(`「${ex ? ex.name : '種目'}」をこの日の記録から削除しますか？`)) return;
    w.entries.splice(ei, 1);
    await saveWorkout(w);
    renderRec();
  }

  // ====================================================
  //  シート（共通オーバーレイ）
  // ====================================================
  let activeSheet = null;
  function openSheet(node) {
    closeSheet(true);
    activeSheet = node;
    // すべてのシートに共通の「閉じる」を付ける（終え方が分かるように）
    const h3 = node.querySelector('h3');
    if (h3 && !node.querySelector('.sheet-close')) {
      const btn = document.createElement('button');
      btn.className = 'sheet-close';
      btn.setAttribute('aria-label', '閉じる');
      btn.innerHTML = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>`;
      btn.addEventListener('click', () => closeSheet());
      h3.insertAdjacentElement('afterend', btn);
      node.classList.add('has-close');
    }
    document.body.appendChild(node);
    $('#overlay').classList.add('show');
    requestAnimationFrame(() => node.classList.add('show'));
  }
  function closeSheet(immediate) {
    const node = activeSheet; activeSheet = null;
    $('#overlay').classList.remove('show');
    if (!node) return;
    node.style.bottom = '';
    node.classList.remove('show');
    if (immediate) node.remove();
    else setTimeout(() => node.remove(), 320);
  }
  $('#overlay').addEventListener('click', () => closeSheet());

  // ---------- セット入力シート ----------
  function openSetSheet(ei, si) {
    const w = workoutByDate(state.recDate);
    if (!w || !w.entries[ei]) return;
    const entry = w.entries[ei];
    const ex = exById(entry.exerciseId);
    const isNew = (si === null);
    const setIndex = isNew ? entry.sets.length : si;

    // 初期値: 既存編集ならその値。新規は「今日の直前セット」→メニューの目標→前回値→既定
    let init;
    if (!isNew) init = { ...entry.sets[si] };
    else {
      const last = entry.sets[entry.sets.length-1];
      const tgt = entry.target;
      const pv0 = prevSetFor(entry.exerciseId, state.recDate);
      if (last) init = { w: last.w, r: last.r };
      else if (tgt && (tgt.weight || tgt.reps)) init = { w: tgt.weight || (pv0 ? pv0.w : 20), r: tgt.reps || 3 };
      else if (pv0) init = { w: pv0.w, r: pv0.r };
      else init = { w: 20, r: 3 };
    }
    let cur = { w: init.w, r: init.r || 3 };

    const pv = prevSetFor(entry.exerciseId, state.recDate);
    const tgt = entry.target;
    const subText = (tgt && (tgt.weight || tgt.reps))
      ? `🎯 目標 ${tgt.weight ? fmtNum(tgt.weight)+'kg × ' : ''}${tgt.reps}回`
      : (pv ? `前回のトレ: ${pv.r}回 × ${fmtNum(pv.w)}kg` : 'はじめての記録');
    const recentW = recentWeights(entry.exerciseId);

    const sheet = document.createElement('div');
    sheet.className = 'sheet';
    sheet.innerHTML = `
      <div class="grabber"></div>
      <h3><button class="sheet-star" id="sheetFav" aria-label="お気に入り">${ex.fav?STAR_ON:STAR_OFF}</button>${esc(ex.name)}・${setIndex+1}セット目</h3>
      <div class="sub">${subText}</div>
      <div class="field-box">
        <div class="fb-head"><span class="fb-lbl">回数</span></div>
        <div class="chip-row" id="repScale">
          ${REP_CHOICES.map(n=>`<button data-rep="${n}" class="${cur.r===n?'on':''}">${n}</button>`).join('')}
        </div>
      </div>
      <div class="field-box">
        <div class="fb-head">
          <span class="fb-lbl">重量</span>
          <button class="reset-w" id="resetW">↺ ${fmtNum(init.w)}kg に戻す</button>
        </div>
        <div class="w-main">
          <button class="w-pm" data-w="-1">−</button>
          <div class="w-val"><input class="num-input" id="inW" inputmode="decimal" value="${fmtNum(cur.w)}"><span class="unit">kg</span></div>
          <button class="w-pm" data-w="1">＋</button>
        </div>
        <div class="chip-row small" id="wStepPills">
          <span class="cr-lbl">刻み</span>
          ${WEIGHT_STEPS.map(s=>`<button data-step="${s}" class="${s===state.weightStep?'on':''}">${fmtNum(s)}</button>`).join('')}
        </div>
        ${recentW.length ? `<div class="chip-row small recent" id="wRecent">
          <span class="cr-lbl">最近</span>
          ${recentW.map(v=>`<button data-wset="${v}">${fmtNum(v)}</button>`).join('')}
        </div>` : ''}
      </div>
      <button class="sheet-save big" id="setSave">${isNew?`このセットを記録` : '更新する'}</button>
      ${!isNew?`<button class="sheet-del" id="setDel">このセットを削除</button>`:''}
    `;
    openSheet(sheet);

    const favBtn = sheet.querySelector('#sheetFav');
    if (favBtn) favBtn.addEventListener('click', async () => {
      await toggleFav(entry.exerciseId);
      const ex2 = exById(entry.exerciseId);
      favBtn.innerHTML = ex2.fav ? STAR_ON : STAR_OFF;
      toast(ex2.fav ? 'お気に入りに追加' : 'お気に入りを解除');
      renderEx();
    });
    const inW = sheet.querySelector('#inW');
    inW.addEventListener('focus', () => setTimeout(() => inW.select(), 0));
    sheet.querySelector('#resetW').addEventListener('click', () => { inW.value = fmtNum(init.w); });
    sheet.querySelectorAll('[data-w]').forEach(b => b.addEventListener('click', () => {
      const sign = parseFloat(b.dataset.w);
      let v = parseFloat(inW.value)||0;
      v = Math.max(0, Math.round((v + sign*state.weightStep)*100)/100);
      inW.value = fmtNum(v);
    }));
    sheet.querySelector('#wStepPills').addEventListener('click', (e) => {
      const b = e.target.closest('[data-step]'); if (!b) return;
      state.weightStep = parseFloat(b.dataset.step);
      try { localStorage.setItem('tsumiage-wstep', state.weightStep); } catch (_) {}
      sheet.querySelectorAll('#wStepPills button').forEach(x => x.classList.toggle('on', parseFloat(x.dataset.step)===state.weightStep));
    });
    const recentEl = sheet.querySelector('#wRecent');
    if (recentEl) recentEl.addEventListener('click', (e) => {
      const b = e.target.closest('[data-wset]'); if (!b) return;
      inW.value = fmtNum(parseFloat(b.dataset.wset));
    });
    sheet.querySelector('#repScale').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-rep]'); if (!btn) return;
      cur.r = parseInt(btn.dataset.rep,10);
      sheet.querySelectorAll('#repScale button').forEach(b => b.classList.toggle('on', parseInt(b.dataset.rep,10)===cur.r));
    });

    sheet.querySelector('#setSave').addEventListener('click', async () => {
      const wv = Math.max(0, parseFloat(inW.value)||0);
      const rv = cur.r;
      if (!rv) { toast('回数を選んでください'); return; }
      const setObj = { w: wv, r: rv, at: isNew ? now() : (entry.sets[si]?.at || null) };
      // 記録前の自己ベストと比較（今日の新規セットのみ祝う）
      const prevBest = bestWeight(entry.exerciseId);
      const willRest = isNew && state.recDate === todayStr();
      // iOSは「タップした流れの中で」しか再生を許さないため、
      // 保存を待つ前にタイマー（＝音の再生）を始める
      if (willRest) startRest(ex.name);
      if (isNew) entry.sets.push(setObj); else entry.sets[si] = setObj;
      await saveWorkout(w);
      closeSheet(); renderRec();
      if (willRest && wv > 0 && wv > prevBest) prCelebrate(ex.name, wv);
    });
    if (!isNew) sheet.querySelector('#setDel').addEventListener('click', async () => {
      const s = entry.sets[si];
      const lastOne = entry.sets.length === 1;
      const msg = lastOne
        ? `${si+1}セット目（${s.r}回 × ${fmtNum(s.w)}kg）を削除しますか？\n最後のセットなので「${ex.name}」も記録から外れます。`
        : `${si+1}セット目（${s.r}回 × ${fmtNum(s.w)}kg）を削除しますか？`;
      if (!confirm(msg)) return;
      entry.sets.splice(si, 1);
      if (!entry.sets.length) w.entries.splice(ei, 1); // セット0なら種目ごと外す
      await saveWorkout(w);
      closeSheet(); renderRec();
    });
  }

  // ===================== レストタイマー =====================
  // iOS対策: 「無音+アラーム音」の音声を先に再生しておくことで、
  // アプリを閉じていても時間が来た瞬間に音で知らせる（PWAは予約通知ができないため）
  let restAudio = null, restAudioUrl = null, audioBlocked = false;

  function initAudio() {
    if (restAudio) { applyAudioSession(); bindAudioRecovery(); return; }
    restAudio = new Audio();
    restAudio.preload = 'auto';
    applyAudioSession();
    bindAudioRecovery();
  }
  // 再生の性格を指定する
  //   playback     … 画面ロック中も鳴る代わり、他アプリの音楽を止める
  //   ambient      … 音楽と共存できる代わり、画面ロック中は鳴らない
  function applyAudioSession() {
    try {
      if (navigator.audioSession) navigator.audioSession.type = state.mixAudio ? 'ambient' : 'playback';
    } catch (_) {}
  }
  // 以前はアプリを開いた最初のタップで無音を再生して許可を取っていたが、
  // それだけで再生中の音楽が止まってしまうため廃止。
  // 音を扱うのは「セットを記録してタイマーが始まる瞬間」だけにする。
  // ただし再生を拒否された場合に限り、次のタップで鳴らし直す。
  document.addEventListener('click', () => {
    if (!audioBlocked) return;
    audioBlocked = false;
    const remain = state.restEndAt - Date.now();
    if (remain > 0) scheduleRestSound(remain / 1000);
  }, true);

  // 無音(silenceSec) + ビープ のWAVを生成
  // 鳴らせる音の種類（波形は数式で生成）
  const REST_SOUNDS = [
    { id: 'beep',   label: 'ピピッ',   sec: 2.1 },
    { id: 'chime',  label: 'ピンポン', sec: 2.4 },
    { id: 'bell',   label: 'ベル',     sec: 2.6 },
    { id: 'buzz',   label: 'ブザー',   sec: 2.2 },
    { id: 'rise',   label: '上昇音',   sec: 2.0 },
    { id: 'marimba',label: 'マリンバ', sec: 2.4 },
    { id: 'digital',label: 'デジタル', sec: 2.2 },
    { id: 'gong',   label: 'ゴング',   sec: 2.8 },
  ];
  const soundDef = (id) => REST_SOUNDS.find(s => s.id === id) || REST_SOUNDS[0];

  // 種類ごとの波形（t = 鳴り始めからの秒数, 戻り値 -1〜1）
  function soundSample(type, t) {
    if (type === 'chime') {
      // ピンポン: 2回。1打ごとに高→低の2音
      const hit = Math.floor(t / 1.2), dt = t - hit*1.2;
      if (hit >= 2 || dt >= 1.0) return 0;
      const freq = dt < 0.42 ? 988 : 740;
      const local = dt < 0.42 ? dt : dt - 0.42;
      const env = Math.min(1, local/0.008) * Math.exp(-3.2 * local);
      return Math.sin(2*Math.PI*freq*t) * 0.85 * env;
    }
    if (type === 'bell') {
      // ベル: 倍音つきで余韻を残す
      const hit = Math.floor(t / 1.3), dt = t - hit*1.3;
      if (hit >= 2 || dt >= 1.25) return 0;
      const env = Math.min(1, dt/0.005) * Math.exp(-3.0 * dt);
      const base = Math.sin(2*Math.PI*1318*t);
      const over = Math.sin(2*Math.PI*2637*t) * 0.35;
      return (base + over) * 0.6 * env;
    }
    if (type === 'buzz') {
      // ブザー: 低めの矩形波を3回
      const slot = Math.floor(t / 0.7), inSlot = t - slot*0.7;
      if (slot >= 3 || inSlot >= 0.35) return 0;
      const env = Math.min(1, inSlot/0.01) * Math.min(1, (0.35-inSlot)/0.02);
      return Math.sign(Math.sin(2*Math.PI*220*t)) * 0.45 * env;
    }
    if (type === 'rise') {
      // 上昇音: 低→高へ駆け上がる。3回繰り返し
      const hit = Math.floor(t / 0.62), dt = t - hit*0.62;
      if (hit >= 3 || dt >= 0.42) return 0;
      const freq = 440 + 660 * (dt / 0.42);          // 440→1100Hz
      const env = Math.min(1, dt/0.01) * Math.min(1, (0.42-dt)/0.06);
      return Math.sin(2*Math.PI*freq*t) * 0.8 * env;
    }
    if (type === 'marimba') {
      // マリンバ: 木琴風の3音（ド→ミ→ソ）。柔らかく減衰
      const notes = [523, 659, 784];
      const hit = Math.floor(t / 0.55), dt = t - hit*0.55;
      if (hit >= 3 || dt >= 0.5) return 0;
      const fq = notes[hit];
      const env = Math.min(1, dt/0.004) * Math.exp(-6.5 * dt);
      const base = Math.sin(2*Math.PI*fq*t);
      const over = Math.sin(2*Math.PI*fq*4*t) * 0.18;  // 木質感の倍音
      return (base + over) * 0.75 * env;
    }
    if (type === 'digital') {
      // デジタル: 高低2音を素早く交互に。電子アラーム風
      const hit = Math.floor(t / 0.55), dt = t - hit*0.55;
      if (hit >= 4 || dt >= 0.34) return 0;
      const freq = (Math.floor(dt / 0.085) % 2 === 0) ? 1600 : 1200;
      const env = Math.min(1, dt/0.005) * Math.min(1, (0.34-dt)/0.02);
      return Math.sign(Math.sin(2*Math.PI*freq*t)) * 0.32 * env;
    }
    if (type === 'gong') {
      // ゴング: 低い一打。長い余韻でうるさくない
      if (t >= 2.7) return 0;
      const env = Math.min(1, t/0.006) * Math.exp(-1.5 * t);
      const a = Math.sin(2*Math.PI*146*t);
      const b = Math.sin(2*Math.PI*220*t) * 0.5;
      const c = Math.sin(2*Math.PI*349*t) * 0.25;
      return (a + b + c) * 0.5 * env;
    }
    // beep（既定）: 短いビープを4回
    const slot = Math.floor(t / 0.5), inSlot = t - slot*0.5;
    if (slot >= 4 || inSlot >= 0.22) return 0;
    const env = Math.min(1, inSlot/0.01) * Math.min(1, (0.22-inSlot)/0.02);
    return Math.sin(2*Math.PI*880*t) * 0.85 * env;
  }

  // 無音(silenceSec) + 指定の音 のWAVを生成
  function makeRestWav(silenceSec, type) {
    const sr = 8000, beepSec = soundDef(type).sec;
    const total = Math.ceil((silenceSec + beepSec) * sr);
    const bytes = 44 + total * 2;
    const buf = new ArrayBuffer(bytes);
    const v = new DataView(buf);
    const ws = (o, s) => { for (let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
    ws(0,'RIFF'); v.setUint32(4, bytes-8, true); ws(8,'WAVE');
    ws(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
    ws(36,'data'); v.setUint32(40, total*2, true);
    const start = Math.floor(silenceSec * sr);
    for (let i=start;i<total;i++){
      const s = soundSample(type, (i - start) / sr);
      v.setInt16(44 + i*2, Math.max(-1,Math.min(1,s)) * 32767, true);
    }
    return new Blob([buf], { type: 'audio/wav' });
  }

  // 設定画面での試聴（タイマー用の予約音は壊さない別プレイヤー）
  let previewAudio = null, previewUrl = null;
  function previewSound(type) {
    try {
      if (!previewAudio) previewAudio = new Audio();
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(makeRestWav(0, type));
      previewAudio.src = previewUrl;
      previewAudio.currentTime = 0;
      const pr = previewAudio.play();
      if (pr && pr.catch) pr.catch(() => {});
    } catch (_) {}
  }

  function scheduleRestSound(sec) {
    if (!state.restSec) return;   // 音オフなら音声に一切触れない（音楽を止めない）
    initAudio();
    if (restAudioUrl) { URL.revokeObjectURL(restAudioUrl); restAudioUrl = null; }
    try {
      restAudioUrl = URL.createObjectURL(makeRestWav(sec, state.restSound));
      restAudio.src = restAudioUrl;
      restAudio.currentTime = 0;
      const pr = restAudio.play();
      if (pr && pr.catch) pr.catch(() => {
        // iOSに再生を拒否された場合（タップの流れが切れた等）。
        // 次に画面を触ったときに鳴らし直す。
        audioBlocked = true;
      });
    } catch (_) {}
  }

  // 予約音が生きているか確認し、止まっていたら残り時間で鳴らし直す。
  // （他アプリが音を鳴らすとiOSはこちらの再生を中断するため）
  function ensureRestSoundAlive() {
    if (!state.restEndAt) return;                       // タイマーが動いていない
    if (!state.restSec) return;                         // 音オフ
    const remain = state.restEndAt - Date.now();
    if (remain <= 0) return;                            // 時間切れは updateRestBar 側で処理
    const dead = !restAudio || restAudio.paused || restAudio.ended;
    if (dead) scheduleRestSound(remain / 1000);         // 残り秒数で再スケジュール
  }
  // 音声が中断/停止したら、その場で復帰を試みる
  function bindAudioRecovery() {
    if (!restAudio || restAudio._recoveryBound) return;
    restAudio._recoveryBound = true;
    // iOSが他アプリの音で中断したとき
    restAudio.addEventListener('pause', () => { setTimeout(ensureRestSoundAlive, 300); });
    restAudio.addEventListener('error', () => { setTimeout(ensureRestSoundAlive, 300); });
    // 最後まで鳴り切ったら解放（ダイナミックアイランドに残さない）
    restAudio.addEventListener('ended', () => { if (!state.restEndAt) cancelRestSound(); });
  }
  let releaseTimer = null;
  function cancelRestSound() {
    clearTimeout(releaseTimer); releaseTimer = null;
    if (!restAudio) return;
    try {
      restAudio.pause();
      restAudio.currentTime = 0;
      restAudio.removeAttribute('src');   // 再生セッションを手放す
      restAudio.load();
    } catch (_) {}
    if (restAudioUrl) { URL.revokeObjectURL(restAudioUrl); restAudioUrl = null; }
  }

  let restTick = null;
  let restTotalMs = 0;
  function startRest(exName) {
    if (!state.restSec) return; // 0=オフ
    restTotalMs = state.restSec * 1000;
    state.restEndAt = Date.now() + restTotalMs;
    state.restExName = exName || '';
    scheduleRestSound(state.restSec);
    ensureRestBar();
    setupMediaSession();
    if (restTick) clearInterval(restTick);
    restTick = setInterval(updateRestBar, 250);
    updateRestBar();
  }

  // ---------- 手動でタイマーを開始 ----------
  // セット記録とは無関係に使える（ストレッチ、有酸素、記録し忘れなど）
  const MANUAL_TIMES = [30, 60, 90, 120, 180, 300];
  function openTimerSheet() {
    // 動作中なら止めるだけ
    if (state.restEndAt) {
      if (confirm('タイマーが動いています。止めますか？')) stopRest(false);
      return;
    }
    const sheet = document.createElement('div');
    sheet.className = 'sheet';
    sheet.innerHTML = `
      <div class="grabber"></div>
      <h3>タイマーを開始</h3>
      <div class="sub">記録とは関係なく使えます</div>
      <div class="timer-grid" id="timerGrid">
        ${MANUAL_TIMES.map(sec => `<button data-tsec="${sec}">${sec % 60 === 0 ? (sec/60)+'分' : sec+'秒'}</button>`).join('')}
      </div>`;
    openSheet(sheet);
    sheet.querySelector('#timerGrid').addEventListener('click', (e) => {
      const b = e.target.closest('[data-tsec]'); if (!b) return;
      const sec = parseInt(b.dataset.tsec, 10);
      closeSheet();
      startRestFor(sec, '');   // タップの流れの中で開始（iOSの音の制約対策）
    });
  }
  // 指定秒でタイマーを開始（設定値を一時的に上書き）
  function startRestFor(sec, exName) {
    const keep = state.restSec;
    state.restSec = sec;
    startRest(exName);
    state.restSec = keep;      // 設定そのものは変えない
    restTotalMs = sec * 1000;
  }
  $('#manualTimerBtn').addEventListener('click', openTimerSheet);

  // ---------- ロック画面の表示（Media Session） ----------
  // 再生中はロック画面に出るので、そこに種目名と残り時間を出し、
  // 一時停止ボタンを「スキップ」として使えるようにする。
  // ジャケットをタップするとアプリが開く。
  function setupMediaSession() {
    if (!('mediaSession' in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: state.restExName ? `休憩中 — ${state.restExName}` : '休憩中',
        artist: 'タップでマッスルを開く',
        album: 'マッスル',
        artwork: [
          { src: 'icon-192.png', sizes: '192x192', type: 'image/png' },
          { src: 'icon-512.png', sizes: '512x512', type: 'image/png' },
        ],
      });
      navigator.mediaSession.playbackState = 'playing';
      // 一時停止＝休憩スキップ
      navigator.mediaSession.setActionHandler('pause', () => stopRest(false));
      navigator.mediaSession.setActionHandler('play', () => {});
      // 早送り／巻き戻しを ±30秒 に
      navigator.mediaSession.setActionHandler('seekforward', () => extendRest(-30));
      navigator.mediaSession.setActionHandler('seekbackward', () => extendRest(30));
      navigator.mediaSession.setActionHandler('nexttrack', () => stopRest(false));
      navigator.mediaSession.setActionHandler('previoustrack', () => extendRest(30));
    } catch (_) {}
  }
  function updateMediaSessionTime() {
    if (!('mediaSession' in navigator)) return;
    const remain = state.restEndAt - Date.now();
    if (remain <= 0) return;
    try {
      if (navigator.mediaSession.setPositionState) {
        navigator.mediaSession.setPositionState({
          duration: restTotalMs / 1000,
          playbackRate: 1,
          position: Math.max(0, (restTotalMs - remain) / 1000),
        });
      }
    } catch (_) {}
  }
  function clearMediaSession() {
    if (!('mediaSession' in navigator)) return;
    try {
      navigator.mediaSession.playbackState = 'none';
      navigator.mediaSession.metadata = null;
      for (const a of ['pause','play','seekforward','seekbackward','nexttrack','previoustrack']) {
        navigator.mediaSession.setActionHandler(a, null);
      }
    } catch (_) {}
  }
  function stopRest(finished) {
    state.restEndAt = 0;
    state.restExName = '';
    clearMediaSession();
    if (restTick) { clearInterval(restTick); restTick = null; }
    if (finished) {
      // 鳴り終わるのを待ってから解放（メディア再生の表示を残さない）
      const wait = (soundDef(state.restSound).sec + 0.3) * 1000;
      clearTimeout(releaseTimer);
      releaseTimer = setTimeout(cancelRestSound, wait);
    } else {
      cancelRestSound(); // スキップ時は即停止
    }
    document.body.classList.remove('rest-on');
    const bar = $('#restBar');
    if (bar) { bar.classList.remove('show'); setTimeout(() => bar.remove(), 300); }
    if (finished) restFinishEffect();
  }
  function extendRest(sec) {
    if (!state.restEndAt) return;
    // 短縮で残りが尽きたら、その場で終了扱いにする
    if (state.restEndAt + sec * 1000 <= Date.now()) { stopRest(true); return; }
    state.restEndAt += sec * 1000;
    restTotalMs = Math.max(1000, restTotalMs + sec * 1000);
    const remainSec = Math.max(0, (state.restEndAt - Date.now()) / 1000);
    scheduleRestSound(remainSec); // 予約音を鳴り直し
    updateRestBar();
    updateMediaSessionTime();
  }
  function ensureRestBar() {
    if ($('#restBar')) return;
    const bar = document.createElement('div');
    bar.id = 'restBar';
    bar.innerHTML = `
      <div class="rest-fill" id="restFill"></div>
      <div class="rest-inner">
        <span class="rest-label">休憩</span>
        <span class="rest-time" id="restTime">--</span>
        <button class="rest-btn" id="restPlus">+30秒</button>
        <button class="rest-btn skip" id="restSkip">スキップ</button>
      </div>`;
    document.body.appendChild(bar);
    document.body.classList.add('rest-on');
    bar.querySelector('#restPlus').addEventListener('click', () => extendRest(30));
    bar.querySelector('#restSkip').addEventListener('click', () => stopRest(false));
    requestAnimationFrame(() => bar.classList.add('show'));
  }
  let soundCheckTick = 0;
  function updateRestBar() {
    const remain = state.restEndAt - Date.now();
    if (remain <= 0) { stopRest(true); return; }
    // 約2秒に1回、予約音が生きているか確認
    if (++soundCheckTick % 8 === 0) { ensureRestSoundAlive(); updateMediaSessionTime(); }
    const t = $('#restTime'); const f = $('#restFill');
    if (t) {
      const s = Math.ceil(remain / 1000);
      t.textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
    }
    if (f) {
      const pct = Math.max(0, Math.min(100, (remain / Math.max(restTotalMs, 1)) * 100));
      f.style.width = pct + '%';
    }
  }
  // 自己ベスト更新のお祝い（タイマーの邪魔をしない控えめなバナー）
  function prCelebrate(exName, weight) {
    try { if (navigator.vibrate) navigator.vibrate([120, 60, 120, 60, 200]); } catch (_) {}
    const old = $('#prBanner'); if (old) old.remove();
    const b = document.createElement('div');
    b.id = 'prBanner';
    b.innerHTML = `<span class="pr-ic">🏆</span><span class="pr-txt"><b>自己ベスト更新！</b><br>${esc(exName)} ${fmtNum(weight)}kg</span>`;
    document.body.appendChild(b);
    requestAnimationFrame(() => b.classList.add('show'));
    const close = () => { b.classList.remove('show'); setTimeout(() => b.remove(), 320); };
    b.addEventListener('click', close);
    setTimeout(close, 3200);
  }

  function restFinishEffect() {
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (_) {}
    const old = $('#restFlash'); if (old) old.remove();
    const flash = document.createElement('div');
    flash.id = 'restFlash';
    flash.innerHTML = `<div class="rest-flash-msg">💪 休憩おわり！</div><div class="rest-flash-sub">タップして閉じる</div>`;
    document.body.appendChild(flash);
    requestAnimationFrame(() => flash.classList.add('show'));
    let closed = false;
    const close = () => {
      if (closed) return; closed = true;
      clearTimeout(autoClose);
      flash.classList.remove('show');
      flash.classList.add('closing');        // 消え際も下のボタンを守るため受け止め続ける
      setTimeout(() => flash.remove(), 320); // 320ms後に確実にDOMから除去
    };
    // フラッシュ自身がタップを受け止めるので、下のボタンを誤爆しない
    flash.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); close(); });
    const autoClose = setTimeout(close, 2500);
  }
  // バックグラウンドから戻ったとき、経過を反映（iOSはinterval停止するため）
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (state.restEndAt) {
      updateRestBar();          // 時間切れならここで stopRest(true) が走る
      ensureRestSoundAlive();   // 他アプリの音で止められていたら鳴らし直す
    } else if (restAudio && !restAudio.paused) {
      cancelRestSound();        // タイマーは終わっているのに鳴り続けていたら解放
    }
  });

  // ---------- 種目ピッカー（選択→確定ボタン方式） ----------
  function openExercisePicker(mode='record') {
    const w = mode==='record' ? workoutByDate(state.recDate) : null;
    let usedIds;
    if (mode==='record') usedIds = new Set(w ? w.entries.map(en=>en.exerciseId) : []);
    else if (mode==='menu') usedIds = new Set((state.editingMenu?.items||[]).map(it=>it.exerciseId));
    else usedIds = new Set();

    const selected = new Set();
    const multi = state.multiPick;   // 設定：複数選択モードか

    const titleMap = { record: '種目を追加', menu: 'メニューに種目を追加' };
    const subSingle = 'タップするとすぐ追加されます';
    const subMulti  = 'タップで選択（複数可）→ 下のボタンで追加';
    const sheet = document.createElement('div');
    sheet.className = 'sheet';
    sheet.innerHTML = `
      <div class="grabber"></div>
      <h3>${titleMap[mode]||'種目を選ぶ'}</h3>
      <div class="sub">${multi ? subMulti : subSingle}</div>
      <div class="pick-list"></div>
      ${multi ? `<div class="pick-footer">
        <button class="pick-confirm" id="pickConfirm" disabled>種目を選んでください</button>
      </div>` : ''}`;
    const listEl = sheet.querySelector('.pick-list');
    const confirmBtn = sheet.querySelector('#pickConfirm');

    function updateConfirm() {
      if (!confirmBtn) return;
      const n = selected.size;
      confirmBtn.disabled = (n === 0);
      confirmBtn.textContent = (n === 0) ? '種目を選んでください' : `${n}種目を追加する`;
    }

    function buildList() {
      let inner = '';
      for (const g of groupedExercises(false)) {
        const isLow = g.key==='lowkey';
        inner += `<div class="pick-cat ${g.key==='fav'?'fav':''} ${isLow?'low':''}">${g.label}</div>`;
        for (const ex of g.items) {
          const used = usedIds.has(ex.id);
          const sel = selected.has(ex.id);
          const usedLabel = '追加済み';
          const right = used ? `<span class="ck used">${usedLabel}</span>`
                             : (multi ? `<span class="pick-check ${sel?'on':''}">${sel?'✓':''}</span>`
                                      : `<span class="pick-arrow">＋</span>`);
          inner += `<div class="pick-item ${isLow?'low':''} ${sel?'selected':''} ${used?'used':''}" data-pick="${ex.id}">
            <span>${esc(ex.name)}</span>${right}
          </div>`;
        }
      }
      listEl.innerHTML = inner;
      updateConfirm();
    }
    buildList();
    openSheet(sheet);

    // 選んだ種目を実際に追加する（単数・複数の共通処理）
    async function commitPick(ids) {
      if (!ids.length) return;
      const single = ids.length === 1 ? exById(ids[0]) : null;
      if (mode==='record') {
        const wk = await ensureWorkout(state.recDate);
        for (const exId of ids) {
          if (!wk.entries.some(en => en.exerciseId === exId)) wk.entries.push({ exerciseId: exId, sets: [] });
        }
        await saveWorkout(wk);
        closeSheet(); renderRec();
        toast(single ? `${single.name}を追加` : `${ids.length}種目を追加しました`);
      } else if (mode==='menu') {
        if (state.editingMenu) for (const exId of ids) state.editingMenu.items.push({ exerciseId: exId, sets: 3, reps: 10, weight: 0 });
        closeSheet(); renderMenuEdit();
        toast(single ? `${single.name}をメニューに追加` : `${ids.length}種目をメニューに追加`);
      }
    }

    listEl.addEventListener('click', async (e) => {
      const item = e.target.closest('[data-pick]'); if (!item) return;
      const exId = item.dataset.pick;
      if (usedIds.has(exId)) { toast('すでに追加済みです'); return; }
      if (!multi) { await commitPick([exId]); return; }   // 1個ずつ：タップで即追加
      if (selected.has(exId)) selected.delete(exId); else selected.add(exId);
      buildList();
    });

    if (confirmBtn) confirmBtn.addEventListener('click', () => commitPick([...selected]));
  }

  // ---------- JSON 書き出し / 取り込み ----------
  const SCHEMA = 'tsumiage.v1';
  function exportData() {
    const data = { schema: SCHEMA, exportedAt: new Date().toISOString(), exercises: state.exercises, workouts: state.workouts, menus: state.menus };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `muscle-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    state.lastExport = Date.now();
    try { localStorage.setItem('tsumiage-lastexport', state.lastExport); } catch (_) {}
    toast('書き出しました');
  }
  async function importData(file) {
    const data = JSON.parse(await file.text());
    if (data.schema !== SCHEMA) throw new Error('schema');
    // exercises: id一致は updatedAt 新しい方、無ければ追加
    const exMap = new Map(state.exercises.map(e=>[e.id,e]));
    for (const it of (data.exercises||[])) {
      const local = exMap.get(it.id);
      if (!local || (it.updatedAt||0) > (local.updatedAt||0)) await put('exercises', it);
    }
    // workouts: 同様に updatedAt 比較
    const wMap = new Map(state.workouts.map(w=>[w.id,w]));
    for (const it of (data.workouts||[])) {
      const local = wMap.get(it.id);
      if (!local || (it.updatedAt||0) > (local.updatedAt||0)) await put('workouts', it);
    }
    // menus: 同様に updatedAt 比較
    const mMap = new Map(state.menus.map(m=>[m.id,m]));
    for (const it of (data.menus||[])) {
      const local = mMap.get(it.id);
      if (!local || (it.updatedAt||0) > (local.updatedAt||0)) await put('menus', it);
    }
    await loadAll();
  }

  // ---------- 起動 ----------
  (async function init() {
    setupViewportTracking();
    try { const s = parseFloat(localStorage.getItem('tsumiage-wstep')); if (s > 0) state.weightStep = s; } catch (_) {}
    try { const r = parseInt(localStorage.getItem('tsumiage-rest'),10); if (!isNaN(r) && r >= 0) state.restSec = r; } catch (_) {}
    try { const a = localStorage.getItem('tsumiage-awake'); if (a !== null) state.keepAwake = (a === '1'); } catch (_) {}
    try { const snd = localStorage.getItem('tsumiage-sound'); if (snd && REST_SOUNDS.some(x=>x.id===snd)) state.restSound = snd; } catch (_) {}
    try { const mp = localStorage.getItem('tsumiage-multipick'); if (mp !== null) state.multiPick = (mp === '1'); } catch (_) {}
    try { const mx = localStorage.getItem('tsumiage-mixaudio'); if (mx !== null) state.mixAudio = (mx === '1'); } catch (_) {}
    try {
      const to = JSON.parse(localStorage.getItem('tsumiage-taborder'));
      if (Array.isArray(to)) {
        // 保存値を検証し、欠けているタブは末尾に補う（アプリ更新でタブが増えても壊れない）
        const valid = to.filter(x => DEFAULT_TAB_ORDER.includes(x));
        const missing = DEFAULT_TAB_ORDER.filter(x => !valid.includes(x));
        if (valid.length) state.tabOrder = [...new Set([...valid, ...missing])];
      }
    } catch (_) {}
    renderTabbar();
    try { const le = parseInt(localStorage.getItem('tsumiage-lastexport'),10); if (!isNaN(le)) state.lastExport = le; } catch (_) {}
    if (!WEIGHT_STEPS.includes(state.weightStep)) state.weightStep = 2.5;
    await openDB();
    await loadAll();
    await seedIfEmpty();
    renderAll();
    syncWakeLock();
    handleLaunchParams();
    requestPersistence();   // OSにデータを消させない
    autoSnapshot();         // 1日1回のバックアップ
  })();

  // ===================== データ保全 =====================
  // ① OSにデータを消させない（iOSのストレージ整理対策の本命）
  async function requestPersistence() {
    try {
      if (!navigator.storage || !navigator.storage.persist) return null;
      if (await navigator.storage.persisted()) return true;
      return await navigator.storage.persist();
    } catch (_) { return null; }
  }
  async function storageStatus() {
    try {
      const persisted = navigator.storage?.persisted ? await navigator.storage.persisted() : null;
      const est = navigator.storage?.estimate ? await navigator.storage.estimate() : null;
      return { persisted, usage: est?.usage || 0 };
    } catch (_) { return { persisted: null, usage: 0 }; }
  }

  // ② アプリ内に自動スナップショット（1日1回・最新7件を保持）
  //    誤操作や取り込み失敗から戻せる。OSがまるごと消した場合は別途の書き出しが要る。
  async function autoSnapshot() {
    try {
      const today = todayStr();
      const all = await getAll('backups');
      if (all.some(b => b.id === today)) return;         // 今日は取得済み
      if (!state.workouts.length) return;                // 記録が無いうちは不要
      await put('backups', {
        id: today, at: now(),
        data: { schema: SCHEMA, exercises: state.exercises, workouts: state.workouts, menus: state.menus },
      });
      // 古いものを削除
      const rest = (await getAll('backups')).sort((a,b) => a.id < b.id ? 1 : -1);
      for (const b of rest.slice(SNAPSHOT_KEEP)) await del('backups', b.id);
    } catch (_) {}
  }
  // スナップショットから復元
  async function restoreSnapshot(id) {
    const all = await getAll('backups');
    const b = all.find(x => x.id === id); if (!b) return;
    const d = b.data;
    const sets = (d.workouts||[]).reduce((t,w)=> t + w.entries.reduce((a,e)=>a+e.sets.length,0), 0);
    if (!confirm(`${fmtDate(b.id)}の状態に戻します。\n（記録 ${(d.workouts||[]).length}日分・${sets}セット）\n今のデータは上書きされます。よろしいですか？`)) return;
    for (const st of ['exercises','workouts','menus']) {
      const cur = await getAll(st);
      for (const it of cur) await del(st, it.id);
      for (const it of (d[st]||[])) await put(st, it);
    }
    await loadAll();
    closeSheet(); renderAll();
    toast('復元しました');
  }

  // ---------- 起動オプション（ショートカット/NFC連携） ----------
  // 例）  ?tab=hist        履歴タブを開く
  //       ?timer=120       2分タイマーを開始（音の許可のため、開始ボタンを一度押す形にする）
  //       ?menu=胸の日     その名前のメニューを今日の記録に入れる
  function handleLaunchParams() {
    let params;
    try { params = new URLSearchParams(location.search); } catch (_) { return; }
    if (![...params.keys()].length) return;

    // タブ指定
    const tab = params.get('tab');
    if (tab && DEFAULT_TAB_ORDER.includes(tab)) switchTab(tab);

    // メニュー展開（名前の部分一致）
    const mname = params.get('menu');
    if (mname) {
      const m = state.menus.find(x => x.name === mname)
             || state.menus.find(x => x.name.includes(mname));
      if (m) applyMenuToday(m.id);
      else toast(`メニュー「${mname}」が見つかりません`);
    }

    // タイマー指定。iOSは画面を触った流れでないと音を鳴らせないので、
    // 自動では始めず「開始」ボタンを出す（1タップで走り出す）
    const tsec = parseInt(params.get('timer'), 10);
    if (!isNaN(tsec) && tsec > 0 && tsec <= 3600) showLaunchTimer(tsec);

    // アドレスバーにパラメータを残さない（再読込で再実行されないように）
    try { history.replaceState(null, '', location.pathname); } catch (_) {}
  }

  function showLaunchTimer(sec) {
    const label = sec % 60 === 0 ? `${sec/60}分` : `${sec}秒`;
    const sheet = document.createElement('div');
    sheet.className = 'sheet';
    sheet.innerHTML = `
      <div class="grabber"></div>
      <h3>${label}タイマー</h3>
      <div class="sub">タップで開始します</div>
      <button class="sheet-save big" id="launchStart">${label}で開始する</button>`;
    openSheet(sheet);
    sheet.querySelector('#launchStart').addEventListener('click', () => {
      closeSheet();
      startRestFor(sec, '');
    });
  }

  // ---------- visualViewport ----------
  function setupViewportTracking() {
    const vv = window.visualViewport; if (!vv) return;
    const root = document.documentElement;
    function apply() {
      root.style.setProperty('--app-height', vv.height + 'px');
      // キーボードが出た分だけシートを持ち上げ、入力欄が隠れないようにする
      const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      if (activeSheet) activeSheet.style.bottom = kb + 'px';
    }
    vv.addEventListener('resize', apply);
    vv.addEventListener('scroll', apply);
    window.addEventListener('orientationchange', () => setTimeout(apply, 300));
    apply();
  }

  // ---------- Service Worker ----------
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', async () => {
      try {
        const swUrl = new URL('sw.js', location.href).href;
        const res = await fetch(swUrl, { method: 'HEAD' });
        if (!res.ok) return;
        const reg = await navigator.serviceWorker.register('sw.js');
        if (reg.waiting && navigator.serviceWorker.controller) showUpdateBanner(reg.waiting);
        reg.addEventListener('updatefound', () => {
          const sw = reg.installing; if (!sw) return;
          sw.addEventListener('statechange', () => { if (sw.state==='installed' && navigator.serviceWorker.controller) showUpdateBanner(sw); });
        });
        reg.update();
        document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible') reg.update(); });
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => { if (refreshing) return; refreshing = true; location.reload(); });
      } catch (e) {}
    });
  }
  function showUpdateBanner(waitingSW) {
    if ($('#updateBanner')) return;
    const b = document.createElement('button');
    b.id = 'updateBanner';
    b.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg><span>新しいバージョンがあります — タップで更新</span>';
    b.addEventListener('click', () => { b.disabled = true; b.querySelector('span').textContent = '更新中…'; waitingSW.postMessage('SKIP_WAITING'); });
    document.body.appendChild(b);
    requestAnimationFrame(() => b.classList.add('show'));
  }
</script>
</body>
</html>
